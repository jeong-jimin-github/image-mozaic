name: .NET Core Build and Release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python used for dependency packaging
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore dependencies
      run: dotnet restore ImageMosaicEditor.sln

    - name: Publish self-contained application
      run: dotnet publish ImageMosaicEditor.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Bundle Python runtime and AI dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $pythonVersion = '3.12.10'
        $runtimeDir = Join-Path $PWD 'publish/python-runtime'
        $sitePackages = Join-Path $runtimeDir 'Lib/site-packages'
        $embedZip = Join-Path $env:RUNNER_TEMP 'python-embed-amd64.zip'

        New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
        Invoke-WebRequest `
          -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" `
          -OutFile $embedZip
        Expand-Archive -Path $embedZip -DestinationPath $runtimeDir -Force

        $pthFile = Get-ChildItem $runtimeDir -Filter 'python*._pth' | Select-Object -First 1
        if (-not $pthFile) { throw 'Embedded Python _pth file was not found.' }
        $pth = Get-Content $pthFile.FullName
        $pth = $pth | ForEach-Object { if ($_ -eq '#import site') { 'import site' } else { $_ } }
        $pth += 'Lib\site-packages'
        Set-Content -Path $pthFile.FullName -Value $pth -Encoding ascii

        New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
        python -m pip install --disable-pip-version-check --no-cache-dir `
          -r ./python/requirements.txt `
          --target $sitePackages

        Get-ChildItem $sitePackages -Directory -Recurse -Filter '__pycache__' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem $sitePackages -File -Recurse -Include '*.pyc' | Remove-Item -Force -ErrorAction SilentlyContinue

        $env:PYTHONUTF8 = '1'
        $env:PYTHONNOUSERSITE = '1'
        & (Join-Path $runtimeDir 'python.exe') -c "from PIL import Image; from imgutils.detect import detect_censors; import ultralytics; print('Bundled Python dependencies OK')"
        if ($LASTEXITCODE -ne 0) { throw 'Bundled Python dependency smoke test failed.' }

    - name: Zip Artifact
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ImageMosaicEditor-win-x64.zip

    - name: Determine or create tag
      id: tag
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          TAG="v$(date -u +'%Y.%m.%d').${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        files: ImageMosaicEditor-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
