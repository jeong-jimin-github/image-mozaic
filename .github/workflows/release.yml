name: .NET Core Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python used for dependency packaging
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore dependencies
      run: dotnet restore ImageMosaicEditor.sln

    - name: Publish self-contained application
      run: dotnet publish ImageMosaicEditor.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Bundle Python runtime and censor dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $pythonVersion = '3.12.10'
        $runtimeDir = Join-Path $env:RUNNER_TEMP 'image-mozaic-python-runtime'
        $sitePackages = Join-Path $runtimeDir 'Lib/site-packages'
        $embedZip = Join-Path $env:RUNNER_TEMP 'python-embed-amd64.zip'
        $publishRuntime = Join-Path $PWD 'publish/python-runtime'

        Remove-Item $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item $publishRuntime -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

        Invoke-WebRequest `
          -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" `
          -OutFile $embedZip
        Expand-Archive -Path $embedZip -DestinationPath $runtimeDir -Force

        $pthFile = Get-ChildItem $runtimeDir -Filter 'python*._pth' | Select-Object -First 1
        if (-not $pthFile) { throw 'Embedded Python _pth file was not found.' }

        $pth = Get-Content $pthFile.FullName
        $pth = $pth | ForEach-Object {
          if ($_.Trim() -eq '#import site') { 'import site' } else { $_ }
        }
        if ($pth -notcontains 'Lib\site-packages') {
          $pth += 'Lib\site-packages'
        }
        Set-Content -Path $pthFile.FullName -Value $pth -Encoding ascii

        New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
        python -m pip install --disable-pip-version-check --no-cache-dir `
          -r ./python/requirements.txt `
          --target $sitePackages

        Get-ChildItem $sitePackages -Directory -Recurse -Filter '__pycache__' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem $sitePackages -File -Recurse -Include '*.pyc' | Remove-Item -Force -ErrorAction SilentlyContinue

        $env:PYTHONUTF8 = '1'
        $env:PYTHONNOUSERSITE = '1'
        & (Join-Path $runtimeDir 'python.exe') -c "import cv2, numpy, onnxruntime; from PIL import Image; from imgutils.detect import detect_censors, detect_with_nudenet; print('Bundled Python dependencies OK')"
        if ($LASTEXITCODE -ne 0) { throw 'Bundled Python dependency smoke test failed.' }

        Copy-Item -Path $runtimeDir -Destination $publishRuntime -Recurse -Force

    - name: Verify release layout
      shell: pwsh
      run: |
        if (-not (Test-Path './publish/ImageMosaicEditor.exe')) { throw 'ImageMosaicEditor.exe is missing.' }
        if (-not (Test-Path './publish/python-runtime/python.exe')) { throw 'Bundled python.exe is missing.' }
        if (-not (Test-Path './publish/python/auto_mosaic_bridge.py')) { throw 'auto_mosaic_bridge.py is missing.' }
        if (-not (Test-Path './publish/python/image_decode_bridge.py')) { throw 'image_decode_bridge.py is missing.' }

    - name: Build Portable ZIP
      shell: pwsh
      run: |
        $zip = './ImageMosaicEditor-win-x64-Portable.zip'
        if (Test-Path $zip) { Remove-Item $zip -Force }
        7z a -tzip -mx=7 $zip ./publish/*
        if ($LASTEXITCODE -ne 0) { throw '7-Zip portable packaging failed.' }

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --yes --no-progress
        if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

    - name: Build Installer EXE
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $candidates = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
        )
        $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) {
          $iscc = Get-ChildItem 'C:\Program Files*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }

        $version = "1.0.${{ github.run_number }}"
        & $iscc "/DMyAppVersion=$version" './installer/ImageMosaicEditor.iss'
        if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
        if (-not (Test-Path './dist/ImageMosaicEditor-Setup-win-x64.exe')) {
          throw 'Installer EXE was not generated.'
        }

    - name: Determine or create tag
      id: tag
      shell: bash
      run: |
        TAG="v$(date -u +'%Y.%m.%d').${{ github.run_number }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$TAG"
        git push origin "$TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release with two download choices
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        body: |
          ## 다운로드 선택
          1. **ImageMosaicEditor-Setup-win-x64.exe** — 설치 마법사 방식. 시작 메뉴/제거 프로그램 등록이 필요한 경우 권장합니다.
          2. **ImageMosaicEditor-win-x64-Portable.zip** — 무설치 Portable 방식. 압축을 풀고 바로 실행합니다.

          두 파일 모두 self-contained .NET 런타임, Python 런타임 및 정밀 자동 검열 의존성을 포함합니다.
        files: |
          dist/ImageMosaicEditor-Setup-win-x64.exe
          ImageMosaicEditor-win-x64-Portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
