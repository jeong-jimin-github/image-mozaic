name: .NET Core Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python used for dependency packaging
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore dependencies
      run: dotnet restore ImageMosaicEditor.sln

    - name: Publish self-contained application
      run: dotnet publish ImageMosaicEditor.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Bundle Python runtime and required AI dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $pythonVersion = '3.12.10'
        $runtimeDir = Join-Path $env:RUNNER_TEMP 'image-mozaic-python-runtime'
        $sitePackages = Join-Path $runtimeDir 'Lib/site-packages'
        $embedZip = Join-Path $env:RUNNER_TEMP 'python-embed-amd64.zip'
        $publishRuntime = Join-Path $PWD 'publish/python-runtime'

        Remove-Item $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item $publishRuntime -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

        Invoke-WebRequest `
          -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" `
          -OutFile $embedZip
        Expand-Archive -Path $embedZip -DestinationPath $runtimeDir -Force

        $pthFile = Get-ChildItem $runtimeDir -Filter 'python*._pth' | Select-Object -First 1
        if (-not $pthFile) { throw 'Embedded Python _pth file was not found.' }

        $pth = Get-Content $pthFile.FullName
        $pth = $pth | ForEach-Object {
          if ($_.Trim() -eq '#import site') { 'import site' } else { $_ }
        }
        if ($pth -notcontains 'Lib\site-packages') {
          $pth += 'Lib\site-packages'
        }
        Set-Content -Path $pthFile.FullName -Value $pth -Encoding ascii

        New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
        python -m pip install --disable-pip-version-check --no-cache-dir `
          -r ./python/requirements.txt `
          --target $sitePackages

        Get-ChildItem $sitePackages -Directory -Recurse -Filter '__pycache__' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem $sitePackages -File -Recurse -Include '*.pyc' | Remove-Item -Force -ErrorAction SilentlyContinue

        $env:PYTHONUTF8 = '1'
        $env:PYTHONNOUSERSITE = '1'
        & (Join-Path $runtimeDir 'python.exe') -c "import onnxruntime; from PIL import Image; from imgutils.detect import detect_censors; import natsort, tqdm; print('Bundled Python dependencies OK')"
        if ($LASTEXITCODE -ne 0) { throw 'Bundled Python dependency smoke test failed.' }

        Copy-Item -Path $runtimeDir -Destination $publishRuntime -Recurse -Force

    - name: Verify portable release layout
      shell: pwsh
      run: |
        if (-not (Test-Path './publish/ImageMosaicEditor.exe')) { throw 'ImageMosaicEditor.exe is missing.' }
        if (-not (Test-Path './publish/python-runtime/python.exe')) { throw 'Bundled python.exe is missing.' }
        if (-not (Test-Path './publish/python/auto_mosaic_bridge.py')) { throw 'auto_mosaic_bridge.py is missing.' }

    - name: Zip Artifact
      shell: pwsh
      run: |
        if (Test-Path './ImageMosaicEditor-win-x64.zip') { Remove-Item './ImageMosaicEditor-win-x64.zip' -Force }
        7z a -tzip -mx=7 ImageMosaicEditor-win-x64.zip ./publish/*
        if ($LASTEXITCODE -ne 0) { throw '7-Zip packaging failed.' }

    - name: Determine or create tag
      id: tag
      shell: bash
      run: |
        TAG="v$(date -u +'%Y.%m.%d').${{ github.run_number }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$TAG"
        git push origin "$TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        files: ImageMosaicEditor-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
